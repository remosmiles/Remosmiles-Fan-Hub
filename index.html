<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remosmiles | Der Lächelnde Fux 🦊</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --fux-orange: #ff8c00;
            --fux-dark: #121212;
            --fux-card: #1e1e1e;
            --fux-light: #ffffff;
            --fux-gold: #ffd700;
        }

        body {
            background-color: var(--fux-dark);
            color: var(--fux-light);
            font-family: 'Poppins', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 40px 0;
            overflow-x: hidden;
        }

        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 450px;
            width: 90%;
            background: var(--fux-card);
            border-radius: 30px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }

        .avatar-container {
            position: relative;
            display: inline-block;
            margin-bottom: 10px;
        }

        .fux-avatar {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 5px solid var(--fux-orange);
            box-shadow: 0 0 25px rgba(255, 140, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            object-fit: cover;
        }

        .fux-avatar:hover {
            transform: scale(1.1) rotate(5deg);
        }

        .fux-msg {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--fux-orange);
            color: black;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8rem;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .avatar-container:hover .fux-msg {
            opacity: 1;
        }

        h1 {
            font-size: 2.2rem;
            margin: 10px 0;
            background: linear-gradient(to right, #ff8c00, #ffcc00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Abo-Balken */
        .progress-container {
            background: #111;
            border-radius: 25px;
            height: 30px;
            width: 100%;
            position: relative;
            overflow: hidden;
            border: 2px solid var(--fux-orange);
            margin: 20px 0 10px 0;
        }

        .progress-bar {
            background: linear-gradient(90deg, #ff8c00, #ffcc00);
            height: 100%;
            width: 0%; 
            transition: width 2s ease-out;
        }

        .progress-text {
            position: absolute;
            width: 100%;
            left: 0;
            top: 0;
            line-height: 30px;
            font-weight: bold;
            font-size: 0.9rem;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        /* Hall of Fame Sektion */
        .hall-of-fame {
            margin: 30px 0;
            padding: 15px;
            background: rgba(255, 215, 0, 0.05);
            border-radius: 15px;
            border: 1px dashed var(--fux-gold);
        }

        .hall-of-fame h2 {
            font-size: 1.1rem;
            color: var(--fux-gold);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .hof-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .hof-name {
            background: #2a2a2a;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            border: 1px solid #444;
            transition: 0.3s;
        }

        .hof-name:hover {
            border-color: var(--fux-gold);
            transform: scale(1.05);
        }

        /* Buttons */
        .link-tree {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            background-color: var(--fux-orange);
            color: black;
            text-decoration: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 800;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn:hover {
            background-color: #ffaa33;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 40px;
            font-size: 0.7rem;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="avatar-container">
            <div class="fux-msg">Klick den Fux! 🦊</div>
            <img src="channels4_profile.jpg" alt="Remosmiles" class="fux-avatar" onclick="celebrate()">
        </div>
        
        <h1>Remosmiles</h1>

        <div class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
            <div id="sub-text" class="progress-text">0 / 1000 Füchse</div>
        </div>
        <p id="motivation" style="color:var(--fux-orange); font-weight:bold; font-size:0.85rem; margin-bottom:20px;">Lade...</p>

        <div class="hall-of-fame">
            <h2>🏆 Hall of Fame</h2>
            <div class="hof-grid">
                <span class="hof-name">TopSupporter1</span>
                <span class="hof-name">FuxFan_99</span>
                <span class="hof-name">FortniteKing</span>
                <span class="hof-name">EhrenGast_12</span>
                <span class="hof-name">Lächeln_Expert</span>
            </div>
        </div>

        <div class="link-tree">
            <a href="https://www.youtube.com/@remosmiles?sub_confirmation=1" target="_blank" class="btn" onclick="celebrate()">🔥 Werde die Nummer 1000!</a>
            <a href="https://www.youtube.com/@remosmiles/shorts" target="_blank" class="btn" style="background:#444; color:white;">🎬 Alle Shorts</a>
        </div>

        <div class="footer">
            &copy; 2026 Remosmiles | Schichtchef & Content Creator
        </div>
    </div>

    <script>
        let clickCount = 0;

        function startFuxCounter() {
            const currentSubs = 925; 
            const goal = 1000;
            const subText = document.getElementById('sub-text');
            const progressBar = document.getElementById('progress-bar');
            const motivation = document.getElementById('motivation');

            setTimeout(() => {
                const percent = (currentSubs / goal) * 100;
                progressBar.style.width = percent + "%";
                
                let displayValue = currentSubs - 15;
                const timer = setInterval(() => {
                    if (displayValue >= currentSubs) {
                        clearInterval(timer);
                        motivation.innerText = "🔥 Noch " + (goal - currentSubs) + " bis zum Ziel!";
                    } else {
                        displayValue++;
                        subText.innerText = displayValue + " / " + goal + " Füchse";
                    }
                }, 60);
            }, 500);
        }

        function celebrate() {
            clickCount++;
            confetti({
                particleCount: 100, spread: 70, origin: { y: 0.7 },
                colors: ['#ff8c00', '#ffd700', '#ffffff']
            });

            if (clickCount === 10) {
                var duration = 4 * 1000;
                var end = Date.now() + duration;
                (function frame() {
                  confetti({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ff8c00', '#ffd700'] });
                  confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ff8c00', '#ffd700'] });
                  if (Date.now() < end) { requestAnimationFrame(frame); }
                }());
                clickCount = 0;
            }
        }

        window.onload = startFuxCounter;
    </script>

</body>
</html>
