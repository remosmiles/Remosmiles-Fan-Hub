<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remosmiles | Der Lächelnde Fux 🦊</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --fux-orange: #ff8c00;
            --fux-dark: #121212;
            --fux-light: #ffffff;
        }

        body {
            background-color: var(--fux-dark);
            color: var(--fux-light);
            font-family: 'Poppins', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 450px;
            width: 90%;
        }

        .fux-avatar {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 5px solid var(--fux-orange);
            box-shadow: 0 0 25px rgba(255, 140, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            object-fit: cover;
        }

        .fux-avatar:hover {
            transform: scale(1.1) rotate(10deg);
        }

        h1 {
            font-size: 2.5rem;
            margin: 20px 0 5px 0;
            background: linear-gradient(to right, #ff8c00, #ffcc00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub-headline {
            color: #aaa;
            font-size: 1rem;
            margin-bottom: 30px;
        }

        /* Abo-Balken Styles */
        .progress-container {
            background: #222;
            border-radius: 25px;
            height: 35px;
            width: 100%;
            position: relative;
            overflow: hidden;
            border: 2px solid var(--fux-orange);
            margin-bottom: 10px;
        }

        .progress-bar {
            background: linear-gradient(90deg, #ff8c00, #ffcc00);
            height: 100%;
            width: 0%; /* Startet bei 0 für Animation */
            transition: width 2s ease-out;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .progress-text {
            position: absolute;
            width: 100%;
            left: 0;
            top: 0;
            line-height: 35px;
            font-weight: bold;
            font-size: 1rem;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .motivation {
            color: var(--fux-orange);
            font-weight: bold;
            font-size: 0.9rem;
            animation: pulse 2s infinite;
            margin-bottom: 30px;
        }

        /* Buttons */
        .link-tree {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            background-color: var(--fux-orange);
            color: black;
            text-decoration: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 800;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(255, 140, 0, 0.2);
        }

        .btn:hover {
            background-color: #ffaa33;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 140, 0, 0.4);
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.02); }
            100% { opacity: 1; transform: scale(1); }
        }

        .footer {
            margin-top: 50px;
            font-size: 0.75rem;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="channels4_profile.jpg" alt="Remosmiles" class="fux-avatar" onclick="celebrate()">
        
        <h1>Remosmiles</h1>
        <p class="sub-headline">YouTube: Gameplay, Memes & Fortnite</p>

        <div class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
            <div id="sub-text" class="progress-text">0 / 1000 Füchse</div>
        </div>
        <p id="motivation" class="motivation">Laden...</p>

        <div class="link-tree">
            <a href="https://www.youtube.com/@remosmiles?sub_confirmation=1" target="_blank" class="btn" onclick="celebrate()">🔥 Jetzt abonnieren!</a>
            <a href="https://www.youtube.com/@remosmiles/shorts" target="_blank" class="btn">🦊 Lustige Shorts</a>
        </div>

        <div class="footer">
            &copy; 2026 Remosmiles | Powered by AI Pro 🚀
        </div>
    </div>

    <script>
        // Funktion für das Hochzählen
        function startFuxCounter() {
            const currentSubs = 925; // Deine aktuelle Zahl
            const goal = 1000;
            const subText = document.getElementById('sub-text');
            const progressBar = document.getElementById('progress-bar');
            const motivation = document.getElementById('motivation');

            // Animation des Balkens
            setTimeout(() => {
                const percent = (currentSubs / goal) * 100;
                progressBar.style.width = percent + "%";
                
                // Zahl hochlaufen lassen
                let displayValue = currentSubs - 20;
                const timer = setInterval(() => {
                    if (displayValue >= currentSubs) {
                        clearInterval(timer);
                        motivation.innerText = "🔥 Nur noch " + (goal - currentSubs) + " Abos bis zum 1k Special!";
                    } else {
                        displayValue++;
                        subText.innerText = displayValue + " / " + goal + " Füchse";
                    }
                }, 50);
            }, 500);
        }

        // Konfetti-Effekt
        function celebrate() {
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#ff8c00', '#ffffff', '#ffcc00']
            });
        }

        // Starten, wenn Seite geladen ist
        window.onload = startFuxCounter;
    </script>

</body>
</html>
