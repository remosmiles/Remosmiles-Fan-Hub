<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Remosmiles Fan-Hub | 1000 Abos & 1k-Hype! 🦊</title>
    <meta name="description" content="Willkommen im offiziellen Cyber-Hub von Remosmiles. Hier gibt es alle Infos zur 1000 Abonnenten Challenge, Community-Links und die Hall of Fame!">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --neon-orange: #ff8c00;
            --neon-blue: #00f2ff;
            --cyber-black: #050505;
            --fux-glow: 0 0 15px #ff8c00, 0 0 30px #ff8c00;
            --blue-glow: 0 0 10px #00f2ff, 0 0 20px #00f2ff;
        }

        body {
            background-color: var(--cyber-black);
            color: white;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 40px 0;
            overflow-x: hidden;
            background: radial-gradient(circle at center, #111 0%, #050505 100%);
        }

        /* Scanline Effekt wie bei alten Monitoren */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 10;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        .container {
            z-index: 20;
            text-align: center;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            background: rgba(20, 20, 20, 0.8);
            border: 2px solid var(--neon-orange);
            border-radius: 20px;
            box-shadow: var(--fux-glow);
            backdrop-filter: blur(10px);
        }

        .avatar-container { position: relative; margin-bottom: 20px; }
        
        .fux-avatar {
            width: 150px; height: 150px;
            border-radius: 50%;
            border: 3px solid var(--neon-blue);
            box-shadow: var(--blue-glow);
            transition: 0.5s;
            cursor: pointer;
        }

        .fux-avatar:hover { transform: scale(1.1) rotate(5deg); box-shadow: var(--fux-glow); border-color: var(--neon-orange); }

        h1 {
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--neon-orange);
            text-shadow: var(--fux-glow);
            margin: 10px 0;
        }

        /* LIVE COUNTER STYLE */
        .live-counter {
            font-family: 'Courier New', Courier, monospace;
            background: #000;
            padding: 5px 15px;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            border-radius: 5px;
            display: inline-block;
            margin-bottom: 20px;
            box-shadow: inset 0 0 5px var(--neon-blue);
        }

        /* Fortschrittsbalken */
        .progress-box { margin: 30px 0; }
        .bar-bg {
            background: #222;
            height: 25px;
            border-radius: 10px;
            border: 1px solid var(--neon-blue);
            position: relative;
            overflow: hidden;
        }
        .bar-fill {
            background: linear-gradient(90deg, var(--neon-orange), #ffcc00);
            height: 100%;
            width: 0%;
            box-shadow: 0 0 15px var(--neon-orange);
            transition: width 2s ease-in-out;
        }

        /* Buttons */
        .btn {
            display: block;
            margin: 15px 0;
            padding: 15px;
            background: transparent;
            border: 2px solid var(--neon-orange);
            color: var(--neon-orange);
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            transition: 0.3s;
            border-radius: 5px;
            position: relative;
            overflow: hidden;
        }
        .btn:hover {
            background: var(--neon-orange);
            color: black;
            box-shadow: var(--fux-glow);
        }

        .hall-of-fame {
            margin-top: 30px;
            border: 1px solid var(--neon-blue);
            padding: 15px;
            border-radius: 10px;
            box-shadow: inset 0 0 10px rgba(0, 242, 255, 0.2);
        }
        .hof-title { color: var(--neon-blue); font-size: 0.9rem; margin-bottom: 10px; }
        .hof-names { font-size: 0.8rem; color: #ccc; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }

        .footer { margin-top: 40px; font-size: 0.7rem; color: #444; }
    </style>
</head>
<body>

    <div class="container">
        <div class="avatar-container">
            <img src="channels4_profile.jpg" alt="Remosmiles" class="fux-avatar" onclick="celebrate()">
        </div>
        
        <h1>Remosmiles</h1>
        
        <div class="live-counter">
            SYSTEM STATUS: ONLINE | VISITS: <span id="visit-count">Lade...</span>
        </div>

        <div class="progress-box">
            <div class="bar-bg">
                <div id="progress-bar" class="bar-fill"></div>
            </div>
            <p id="sub-text" style="color:var(--neon-blue); font-weight:bold; margin-top:10px;">925 / 1000 Füchse</p>
        </div>

        <div class="link-tree">
            <a href="https://www.youtube.com/@remosmiles?sub_confirmation=1" target="_blank" class="btn" onclick="celebrate()">Kanal abonnieren</a>
            <a href="https://www.youtube.com/@remosmiles/shorts" target="_blank" class="btn">Meme-Shorts ansehen</a>
        </div>

        <div class="hall-of-fame">
            <div class="hof-title">_CHAMPIONS_OF_THE_FUX_GANG</div>
            <div class="hof-names">
                <span>[REMO_TREME]</span> <span>[POUTINITE]</span> <span>[SOX]</span> <span>[FUX_PRO]</span>
            </div>
        </div>

        <div class="footer">
            DECRYPTING SUCCESS... 2026 // URI // CYBER-ERMITTLER_VIBES
        </div>
    </div>

    <script>
        // ECHTER BESUCHER-ZÄHLER FUNKTION (Nutzt CountAPI)
        async function getVisits() {
            try {
                // Hinweis: Diese URL generiert einen Zähler für deine Vercel-Domain
                const response = await fetch('https://api.countapi.xyz/hit/remosmiles-hub/visits');
                const data = await response.json();
                document.getElementById('visit-count').innerText = data.value;
            } catch (error) {
                // Fallback, falls die API gerade schläft
                document.getElementById('visit-count').innerText = "1.337";
            }
        }

        function initPage() {
            getVisits(); // Zähler starten
            
            // Balken Animation
            const subs = 925;
            const goal = 1000;
            const bar = document.getElementById('progress-bar');
            setTimeout(() => {
                bar.style.width = (subs / goal * 100) + "%";
            }, 500);
        }

        function celebrate() {
            confetti({
                particleCount: 150,
                spread: 80,
                origin: { y: 0.6 },
                colors: ['#ff8c00', '#00f2ff', '#ffffff']
            });
        }

        window.onload = initPage;
    </script>
</body>
</html>
