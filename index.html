<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remosmiles | Der Lächelnde Fux 🦊</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --fux-orange: #ff8c00;
            --fux-dark: #121212;
            --fux-card: #1e1e1e;
            --fux-light: #ffffff;
        }

        body {
            background-color: var(--fux-dark);
            color: var(--fux-light);
            font-family: 'Poppins', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 450px;
            width: 90%;
            background: var(--fux-card);
            border-radius: 30px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }

        /* Avatar Styling */
        .avatar-container {
            position: relative;
            display: inline-block;
        }

        .fux-avatar {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 5px solid var(--fux-orange);
            box-shadow: 0 0 25px rgba(255, 140, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            object-fit: cover;
        }

        .fux-avatar:hover {
            transform: scale(1.1) rotate(5deg);
        }

        /* Tooltip Nachricht */
        .fux-msg {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--fux-orange);
            color: black;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8rem;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .avatar-container:hover .fux-msg {
            opacity: 1;
        }

        h1 {
            font-size: 2.5rem;
            margin: 20px 0 5px 0;
            background: linear-gradient(to right, #ff8c00, #ffcc00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub-headline {
            color: #aaa;
            font-size: 1rem;
            margin-bottom: 30px;
        }

        /* Abo-Balken Styles */
        .progress-container {
            background: #111;
            border-radius: 25px;
            height: 35px;
            width: 100%;
            position: relative;
            overflow: hidden;
            border: 2px solid var(--fux-orange);
            margin-bottom: 10px;
        }

        .progress-bar {
            background: linear-gradient(90deg, #ff8c00, #ffcc00);
            height: 100%;
            width: 0%; 
            transition: width 2s ease-out;
        }

        .progress-text {
            position: absolute;
            width: 100%;
            left: 0;
            top: 0;
            line-height: 35px;
            font-weight: bold;
            font-size: 1rem;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .motivation {
            color: var(--fux-orange);
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 30px;
            min-height: 20px;
        }

        /* Links */
        .link-tree {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            background-color: var(--fux-orange);
            color: black;
            text-decoration: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 800;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
        }

        .btn:hover {
            background-color: #ffaa33;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 140, 0, 0.4);
        }

        /* Dankes-Nachricht beim Hover */
        .btn-sub::after {
            content: "Ehren-Fux! ❤️";
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            color: var(--fux-orange);
            opacity: 0;
            transition: 0.3s;
        }

        .btn-sub:hover::after {
            opacity: 1;
        }

        .footer {
            margin-top: 50px;
            font-size: 0.75rem;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="avatar-container">
            <div class="fux-msg">Klick mich! 🦊</div>
            <img src="channels4_profile.jpg" alt="Remosmiles" class="fux-avatar" onclick="celebrate()">
        </div>
        
        <h1>Remosmiles</h1>
        <p class="sub-headline">Fortnite Gameplay & Memes</p>

        <div class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
            <div id="sub-text" class="progress-text">0 / 1000 Füchse</div>
        </div>
        <p id="motivation" class="motivation">Lade Fux-Power...</p>

        <div class="link-tree">
            <a href="https://www.youtube.com/@remosmiles?sub_confirmation=1" target="_blank" class="btn btn-sub" onclick="celebrate()">🔥 Werde Teil der 1000!</a>
            <a href="https://www.youtube.com/@remosmiles/shorts" target="_blank" class="btn">🦊 Beste Shorts</a>
            <a href="https://www.tiktok.com/@deintiktok" target="_blank" class="btn" style="background: #fff; color: #000;">🎵 TikTok Memes</a>
        </div>

        <div class="footer">
            &copy; 2026 Remosmiles | Mit KI-Power zum Sieg 👑
        </div>
    </div>

    <script>
        let clickCount = 0;

        function startFuxCounter() {
            const currentSubs = 925; 
            const goal = 1000;
            const subText = document.getElementById('sub-text');
            const progressBar = document.getElementById('progress-bar');
            const motivation = document.getElementById('motivation');

            setTimeout(() => {
                const percent = (currentSubs / goal) * 100;
                progressBar.style.width = percent + "%";
                
                let displayValue = currentSubs - 20;
                const timer = setInterval(() => {
                    if (displayValue >= currentSubs) {
                        clearInterval(timer);
                        motivation.innerText = "🔥 Noch " + (goal - currentSubs) + " Abos bis zum 1k Special!";
                    } else {
                        displayValue++;
                        subText.innerText = displayValue + " / " + goal + " Füchse";
                    }
                }, 50);
            }, 500);
        }

        function celebrate() {
            clickCount++;
            
            // Konfetti-Stoß
            confetti({
                particleCount: 120,
                spread: 70,
                origin: { y: 0.7 },
                colors: ['#ff8c00', '#ffffff', '#ffcc00']
            });

            // EASTER EGG: Nach 10 Klicks
            if (clickCount === 10) {
                var duration = 3 * 1000;
                var animationEnd = Date.now() + duration;
                var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

                function randomInRange(min, max) {
                  return Math.random() * (max - min) + min;
                }

                var interval = setInterval(function() {
                  var timeLeft = animationEnd - Date.now();
                  if (timeLeft <= 0) { return clearInterval(interval); }
                  var particleCount = 50 * (timeLeft / duration);
                  confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                  confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
                }, 250);

                setTimeout(() => { alert("🦊 ULTRA-FUX MODUS AKTIVIERT!"); }, 500);
                clickCount = 0;
            }
        }

        window.onload = startFuxCounter;
    </script>

</body>
</html>
