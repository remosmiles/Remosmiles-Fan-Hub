<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remosmiles Cyber-Hub | 932 Füchse 🦊</title>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --neon-orange: #ff8c00;
            --neon-blue: #00f2ff;
            --cyber-black: #050505;
            --fux-glow: 0 0 20px #ff8c00;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--cyber-black);
            font-family: 'Courier New', Courier, monospace;
            color: white;
            overflow-x: hidden;
        }

        /* Bewegter Hintergrund (Matrix-Effekt) */
        #bg-canvas {
            position: fixed;
            top: 0; left: 0;
            z-index: 1;
        }

        .main-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 0;
        }

        .cyber-card {
            background: rgba(10, 10, 10, 0.9);
            border: 2px solid var(--neon-orange);
            border-radius: 15px;
            padding: 30px;
            width: 90%;
            max-width: 480px;
            text-align: center;
            box-shadow: var(--fux-glow);
            backdrop-filter: blur(5px);
        }

        .profile-img {
            width: 140px; height: 140px;
            border-radius: 50%;
            border: 3px solid var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue);
            transition: 0.4s;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .profile-img:hover { transform: scale(1.1) rotate(3deg); border-color: var(--neon-orange); box-shadow: var(--fux-glow); }

        h1 { color: var(--neon-orange); letter-spacing: 5px; text-shadow: var(--fux-glow); margin: 10px 0; }

        .stat-box {
            font-size: 0.8rem;
            color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
            padding: 5px 10px;
            margin: 15px 0;
            display: inline-block;
        }

        /* Abo-Balken */
        .progress-container {
            background: #111;
            height: 25px;
            border-radius: 5px;
            border: 1px solid var(--neon-orange);
            margin: 20px 0;
            overflow: hidden;
            position: relative;
        }
        .progress-bar {
            background: linear-gradient(90deg, #ff4500, var(--neon-orange));
            height: 100%;
            width: 0%; /* Startet bei 0 für Animation */
            box-shadow: 0 0 10px var(--neon-orange);
            transition: width 2s cubic-bezier(0.1, 0, 0.3, 1);
        }

        /* Buttons */
        .cyber-btn {
            display: block;
            margin: 12px 0;
            padding: 15px;
            border: 1px solid var(--neon-orange);
            color: var(--neon-orange);
            text-decoration: none;
            text-transform: uppercase;
            font-weight: bold;
            transition: 0.3s;
            background: rgba(255, 140, 0, 0.05);
        }
        .cyber-btn:hover { background: var(--neon-orange); color: black; box-shadow: var(--fux-glow); }

        /* Secret Button (ehemals unterster Button) */
        .secret-btn {
            border-color: var(--neon-blue);
            color: var(--neon-blue);
            cursor: pointer;
        }
        .secret-btn:hover { background: var(--neon-blue); color: black; box-shadow: 0 0 20px var(--neon-blue); }

        .hall-of-fame {
            margin-top: 25px;
            font-size: 0.7rem;
            border-top: 1px solid #333;
            padding-top: 15px;
            color: #888;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="main-wrapper">
        <div class="cyber-card">
            <img src="channels4_profile.jpg" alt="Remosmiles" class="profile-img" onclick="celebrate()">
            
            <h1>REMOSMILES</h1>
            
            <div class="stat-box">
                SYSTEM_STATUS: <span style="color: #0f0;">ONLINE</span> | VISITS: <span id="v-count">1.427</span>
            </div>

            <div class="progress-container">
                <div id="bar" class="progress-bar"></div>
            </div>
            <div style="color: var(--neon-orange); font-size: 0.9rem; margin-top: -10px;">
                932 / 1000 FÜCHSE
            </div>

            <div style="margin-top: 25px;">
                <a href="https://www.youtube.com/@remosmiles?sub_confirmation=1" target="_blank" class="cyber-btn">Kanal abonnieren</a>
                <a href="https://www.youtube.com/@remosmiles/shorts" target="_blank" class="cyber-btn">Meme-Shorts ansehen</a>
                <div class="cyber-btn secret-btn" onclick="triggerSecret()">Click for Secret!</div>
            </div>

            <div class="hall-of-fame">
                _CHAMPIONS_OF_THE_FUX_GANG<br>
                [REMO_TREME] [POUTINITE] [SOX] [FUX_PRO]
            </div>
        </div>
    </div>

    <script>
        // Matrix Hintergrund Effekt
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let dots = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.onresize = resize;
        resize();

        class Dot {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2;
                this.speed = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.y -= this.speed;
                if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = 'rgba(0, 242, 255, 0.3)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for(let i=0; i<100; i++) dots.push(new Dot());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            dots.forEach(d => { d.update(); d.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        // Seiten-Logik
        window.onload = () => {
            // Abo-Balken auf 93.2% (932/1000)
            setTimeout(() => {
                document.getElementById('bar').style.width = "93.2%";
            }, 500);

            // Besucher-Zähler Simulation
            let count = 1427;
            setInterval(() => {
                if(Math.random() > 0.8) {
                    count++;
                    document.getElementById('v-count').innerText = count.toLocaleString();
                }
            }, 3000);
        };

        function celebrate() {
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#ff8c00', '#00f2ff'] });
        }

        function triggerSecret() {
            alert("Spezial-Nachricht: Du bist Teil der Fux-Elite! Die 1000 Abos rücken näher. 🦊🚀");
            celebrate();
        }
    </script>
</body>
</html>
